name: Publish Go SDK

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic

      - name: Run integration tests
        if: ${{ secrets.CAPBYPASS_API_KEY != '' }}
        env:
          CAPBYPASS_API_KEY: ${{ secrets.CAPBYPASS_API_KEY }}
        run: go test -v -tags=integration

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            Release ${{ github.ref_name }}

            Install:
            `go get github.com/CapBypass-Development/capbypass-sdk-go@${{ github.ref_name }}`

            Note: Go modules are published via Git tags (no separate package upload step).
          draft: false
          prerelease: false
