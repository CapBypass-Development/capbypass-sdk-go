name: Publish Go SDK

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic

    - name: Detect integration secret
      id: intsecret
      env:
        CAPBYPASS_API_KEY: ${{ secrets.CAPBYPASS_API_KEY }}
      run: |
        [ -n "$CAPBYPASS_API_KEY" ] && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"

    - name: Run integration tests
      if: steps.intsecret.outputs.available == 'true'
      env:
        CAPBYPASS_API_KEY: ${{ secrets.CAPBYPASS_API_KEY }}
      run: go test -v -tags=integration

    - name: Determine next version
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        IFS='.' read -r major minor patch <<< "${LATEST_TAG#v}"
        NEW_VERSION="$major.$minor.$((patch + 1))"
        echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

    - name: Create tag and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "v${{ env.VERSION }}"
        git push --tags

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        body: |
          Release v${{ env.VERSION }}

          Install: `go get github.com/CapBypass-Development/capbypass-sdk-go@v${{ env.VERSION }}`
        draft: false
        prerelease: false
