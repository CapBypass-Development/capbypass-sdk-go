name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Get dependencies
      run: go mod download

    - name: Lint with golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.txt

    - name: Detect integration secret
      id: intsecret
      env:
        CAPBYPASS_API_KEY: ${{ secrets.CAPBYPASS_API_KEY }}
      run: |
        [ -n "$CAPBYPASS_API_KEY" ] && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"

    - name: Run integration tests
      if: steps.intsecret.outputs.available == 'true'
      env:
        CAPBYPASS_API_KEY: ${{ secrets.CAPBYPASS_API_KEY }}
      run: go test -v -tags=integration

    - name: Check coverage
      run: |
        go tool cover -func=coverage.txt | grep total | awk '{if ($3+0 < 80) {print "Coverage is below 80%"; exit 1}}'

  # Single stable gate context for branch protection (the matrix job names like
  # "test (1.22)" are version-specific and brittle to require directly).
  tests-passed:
    name: tests-passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the test matrix
        run: |
          r="${{ needs.test.result }}"
          if [ "$r" = "success" ] || [ "$r" = "skipped" ]; then
            echo "tests-passed: $r"
          else
            echo "test matrix result: $r"; exit 1
          fi
